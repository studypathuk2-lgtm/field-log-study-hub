<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Field Log — Study Hub</title>
<style>
  :root{
    --ink:#1b1f2a; --paper:#f5efe1; --paper-line:#e3d9bf; --gold:#c9a227;
    --maths:#5b6ee1; --computing:#2bb3a3; --science:#4c9a5b; --geography:#d97a3f; --history:#9c4b4b; --review:#8a7ab5;
    --ok:#3f8a4c; --warn:#c98a1f; --lock:#7a7a7a;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:Georgia,'Iowan Old Style',serif; background:radial-gradient(ellipse at top,#262c3b 0%,var(--ink) 60%); color:var(--paper); min-height:100vh; padding:16px 12px 60px;}
  .wrap{max-width:900px; width:100%; margin:0 auto;}
  header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid rgba(245,239,225,0.15);}
  h1{font-size:1.35rem; margin:0; letter-spacing:0.5px;}
  .sub-title{font-size:0.7rem; opacity:0.6; margin-top:2px; font-family:-apple-system,system-ui,sans-serif; text-transform:uppercase; letter-spacing:1.3px;}
  .badges{display:flex; gap:8px; flex-shrink:0;}
  .badge{background:rgba(201,162,39,0.15); border:1px solid var(--gold); border-radius:999px; padding:5px 9px; font-size:0.7rem; text-align:center; font-family:-apple-system,system-ui,sans-serif;}
  .badge b{display:block; font-size:0.95rem; color:var(--gold);}
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{flex:1; min-width:70px; text-align:center; padding:9px 4px; border-radius:10px; font-family:-apple-system,system-ui,sans-serif; font-size:0.78rem; background:rgba(255,255,255,0.05); cursor:pointer; border:1px solid transparent;}
  .tab.active{background:rgba(201,162,39,0.18); border-color:var(--gold); color:var(--gold); font-weight:700;}
  .card{background:var(--paper); color:var(--ink); border-radius:6px; padding:18px 16px; margin-bottom:14px; position:relative; box-shadow:0 6px 18px rgba(0,0,0,0.3);}
  .lined{background-image:repeating-linear-gradient(var(--paper),var(--paper) 27px, var(--paper-line) 28px);}
  .subject-tag{display:inline-flex; align-items:center; gap:6px; font-family:-apple-system,system-ui,sans-serif; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:4px 10px; border-radius:999px; color:#fff; margin-bottom:10px;}
  .topic-title{font-size:1.2rem; font-weight:700; margin:0 0 8px; line-height:1.25;}
  .activity-text{font-size:0.95rem; line-height:1.5; margin-bottom:10px;}
  .bbc-link{display:inline-block; font-family:-apple-system,system-ui,sans-serif; font-size:0.8rem; margin-bottom:12px; padding:6px 10px; background:#e2edf5; border:1px solid #a9c6dc; border-radius:6px; color:#1a4a6b; text-decoration:none;}
  .duration-note{font-family:-apple-system,system-ui,sans-serif; font-size:0.75rem; opacity:0.65; margin-bottom:12px;}
  .quiz-q{margin-bottom:12px; font-family:-apple-system,system-ui,sans-serif;}
  .quiz-q p{font-weight:600; font-size:0.9rem; margin:0 0 6px;}
  .opt{display:block; padding:8px 10px; margin-bottom:6px; border:1px solid #c9bfa3; border-radius:6px; font-size:0.86rem; cursor:pointer; background:#fffdf7;}
  .opt input{margin-right:8px;}
  .opt.correct{border-color:var(--ok); background:#e5f4e7;}
  .opt.wrong{border-color:#a33; background:#fbe5e5;}
  button{font-family:-apple-system,system-ui,sans-serif; font-weight:700; font-size:0.88rem; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; width:100%;}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:disabled{opacity:0.35;}
  .btn-complete{background:var(--gold); color:var(--ink); margin-top:8px;}
  .btn-complete:disabled{background:#8a8a8a; color:#ddd;}
  .stamp{position:absolute; top:14px; right:14px; border:3px solid var(--history); color:var(--history); border-radius:8px; padding:4px 10px; font-family:-apple-system,system-ui,sans-serif; font-weight:800; font-size:0.68rem; transform:rotate(9deg); letter-spacing:1px;}
  .milestone{background:rgba(201,162,39,0.2); border:1px dashed var(--gold); border-radius:8px; padding:10px 12px; font-family:-apple-system,system-ui,sans-serif; font-size:0.83rem; margin-bottom:12px; color:#5a4a1a;}
  .lock-msg{font-family:-apple-system,system-ui,sans-serif; font-size:0.88rem; text-align:center; padding:18px; opacity:0.85;}
  .prompt-msg{font-family:-apple-system,system-ui,sans-serif; font-size:0.9rem; text-align:center; padding:26px 16px; opacity:0.85;}

  .subj-picker{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .subj-btn{flex:1; min-width:64px; text-align:center; padding:10px 4px; border-radius:10px; font-family:-apple-system,system-ui,sans-serif; font-size:0.78rem; cursor:pointer; border:2px solid transparent; background:rgba(255,255,255,0.06); position:relative;}
  .subj-btn.picked{border-color:var(--gold);}
  .subj-btn .pick-star{position:absolute; top:-6px; right:-4px; font-size:0.7rem;}

  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px;}
  table.term-grid{width:100%; min-width:640px; border-collapse:collapse; font-family:-apple-system,system-ui,sans-serif; font-size:0.72rem;}
  table.term-grid th, table.term-grid td{border:1px solid var(--paper-line); padding:6px 5px; text-align:center; vertical-align:top; width:90px;}
  table.term-grid th{background:#e9dfc4; font-size:0.68rem;}
  table.term-grid td.subj-cell{text-align:left; font-weight:700; background:#efe6d1; width:90px;}
  .cell-topic{font-size:0.62rem; opacity:0.75; display:block; margin-bottom:3px;}
  .status-pill{display:inline-block; padding:2px 6px; border-radius:6px; font-size:0.6rem; font-weight:700;}
  .status-complete{background:#dcefdd; color:var(--ok);}
  .status-progress{background:#fdf1d8; color:var(--warn);}
  .status-notstarted{background:#e9e5da; color:#888;}
  .status-checkpoint{background:#fde4e0; color:#a33;}
  .scroll-hint{font-family:-apple-system,system-ui,sans-serif; font-size:0.68rem; opacity:0.6; margin-bottom:8px;}

  .assess-panel{font-family:-apple-system,system-ui,sans-serif;}
  select, .term-check-row{width:100%; margin-bottom:8px; font-size:0.85rem;}
  select{padding:8px; border-radius:6px; border:1px solid #c9bfa3;}
  .term-check-row label{display:inline-flex; align-items:center; gap:5px; margin-right:10px; font-size:0.8rem;}

  .notes-form input, .notes-form select, .notes-form textarea{width:100%; margin-bottom:8px; padding:9px; border-radius:6px; border:1px solid #c9bfa3; font-family:-apple-system,system-ui,sans-serif; font-size:0.88rem;}
  .notes-form textarea{min-height:60px; resize:vertical;}
  .note-entry{border-bottom:1px solid var(--paper-line); padding:10px 0; font-family:-apple-system,system-ui,sans-serif;}
  .note-entry .meta{font-size:0.7rem; opacity:0.6; margin-bottom:4px;}
  .note-entry .subj-chip{display:inline-block; padding:1px 8px; border-radius:999px; color:#fff; font-size:0.65rem; font-weight:700; margin-right:6px;}
  .note-text{font-size:0.9rem; line-height:1.4;}
  .del-link{font-size:0.7rem; color:#a33; cursor:pointer; float:right; font-family:-apple-system,system-ui,sans-serif;}

  .type-card{background:#2b2b26; color:#e8e3d3; border:2px solid #5a5648;}
  .type-mode-row{display:flex; gap:8px; margin-bottom:12px;}
  .type-mode{flex:1; text-align:center; padding:8px; border-radius:6px; font-family:'Courier New',monospace; font-size:0.8rem; cursor:pointer; background:rgba(255,255,255,0.08); border:1px solid transparent;}
  .type-mode.active{border-color:var(--gold); color:var(--gold);}
  .type-target{font-family:'Courier New',monospace; font-size:1.15rem; line-height:1.8; letter-spacing:0.5px; padding:14px; background:#1c1c19; border-radius:6px; margin-bottom:12px; word-break:break-all;}
  .ch-correct{color:#7fd68a;}
  .ch-wrong{color:#e06a6a; text-decoration:underline;}
  .ch-pending{color:#8a8577;}
  .type-input{width:100%; font-family:'Courier New',monospace; font-size:1rem; padding:10px; border-radius:6px; border:1px solid #5a5648; background:#e8e3d3; color:#1c1c19;}
  .type-stats{display:flex; gap:10px; margin-top:12px; font-family:-apple-system,system-ui,sans-serif; font-size:0.8rem;}
  .type-stat{flex:1; text-align:center; background:rgba(255,255,255,0.06); border-radius:6px; padding:8px;}
  .type-stat b{display:block; font-size:1.1rem; color:var(--gold);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ DATA ============ */
const SUBJECT_META = {
  maths:      {label:'Maths',      color:'var(--maths)',      icon:'➗'},
  computing:  {label:'Computing',  color:'var(--computing)',  icon:'💻'},
  science:    {label:'Science',    color:'var(--science)',    icon:'🔬'},
  geography:  {label:'Geography',  color:'var(--geography)',  icon:'🌍'},
  history:    {label:'History',    color:'var(--history)',    icon:'🏛️'},
};

const TERM_TOPICS = {
  maths:     {1:'Expressions, multiply/divide, substitution, statistics', 2:'Brackets & factorising, algebraic fractions', 3:'Forming expressions, linear equations, rearranging formulae', 4:'Rearranging formulae, sequences, inequalities', 5:'Inequalities, percentage change, angles & polygons', 6:'Linear graphs, loci & constructions'},
  computing: {1:'E-safety', 2:'Game creation (GameMaker)', 3:'Website design & HTML', 4:'Graphics editing', 5:'Theory (binary, data units)', 6:'Visual Basic — till system'},
  science:   {1:'Forces, Organisms, Matter', 2:'Forces, Organisms, Matter', 3:'Energy, Reactions, Ecosystems', 4:'Energy, Reactions, Ecosystems', 5:'Electricity, Waves, Genes, Earth', 6:'Electricity, Waves, Genes, Earth'},
  geography: {1:'Rocks & landscapes', 2:'Urban change', 3:'Coasts', 4:'International development', 5:'Biomes', 6:'Africa'},
  history:   {1:'The Renaissance', 2:'The Reformation & Tudors', 3:'Black Tudors', 4:'English Civil War & Cromwell', 5:'Industrial Revolution', 6:'Age of Revolution'},
};

const BBC_HOME = 'https://www.bbc.co.uk/bitesize';

const SESSIONS = {
  maths: [
    {term:1, title:'Expressions & Simplifying', bbcSearch:'algebra simplifying expressions',
      activity:"Watch a short video on 'collecting like terms'. Group real objects into piles (pens, coins) — like terms are just piles of the same thing! Simplify 5 expressions, e.g. 3x + 2x + 5y − y.",
      quiz:[{q:'Simplify 4x + 3x.',opts:['7x','12x','7x²','12'],a:0},{q:'Simplify 5y + 2y − y.',opts:['6y','7y','8y','4y'],a:0},{q:'Which pair can be added together?',opts:['3x and 3y','4x and 5x','2x and 2x²','3 and x'],a:1},{q:'Simplify 7x − 2x + 3x.',opts:['8x','12x','2x','9x'],a:0},{q:'Which is NOT a like term to 3ab?',opts:['5ab','−2ab','ab','3a'],a:3}]},
    {term:1, title:'Multiplying & Dividing Terms', bbcSearch:'algebra multiplying dividing terms',
      activity:"Learn the rule: multiply the numbers, add the powers of the same letter (x² × x = x³). Practice 5 mixed multiply/divide questions.",
      quiz:[{q:'3x × 2x = ?',opts:['6x','6x²','5x²','5x'],a:1},{q:'x² × x = ?',opts:['x²','x³','2x²','x'],a:1},{q:'10x ÷ 2 = ?',opts:['5x','20x','5','8x'],a:0},{q:'4x² ÷ 2x = ?',opts:['2x','2x²','8x','2'],a:0},{q:'5x × 4 = ?',opts:['20x','9x','20x²','5x4'],a:0}]},
    {term:1, title:'Substitution', bbcSearch:'algebra substitution',
      activity:"Substitution = swapping letters for numbers. Try: speed = distance ÷ time. If distance=100m, time=20s, what's the speed? Practice 5 more.",
      quiz:[{q:'If x = 3, what is 2x + 1?',opts:['5','7','6','9'],a:1},{q:'If a=4, b=2, a × b = ?',opts:['6','8','2','42'],a:1},{q:'Area = L × W. L=5, W=3, area = ?',opts:['8','15','153','53'],a:1},{q:'If y=5, what is 3y − 4?',opts:['11','15','9','19'],a:0},{q:'If p=2, q=6, what is q − p?',opts:['4','8','12','3'],a:0}]},
    {term:1, title:'Statistics — Averages', bbcSearch:'averages mean median mode',
      activity:"Learn mean, median, mode, range using your own data set (shoe sizes at home, or game scores). Calculate all four.",
      quiz:[{q:'Mode of 2,2,3,5,5,5,7?',opts:['2','3','5','7'],a:2},{q:'Range of 4,9,2,15?',opts:['13','11','9','15'],a:0},{q:'Mean of 2,4,6?',opts:['3','4','6','12'],a:1},{q:'The mode is the value that:',opts:['Appears most often','Is exactly in the middle','Is the average','Is the biggest'],a:0},{q:'To find the mean you:',opts:['Add all values and divide by how many there are','Just add all values','Pick the middle value','Pick the most common value'],a:0}]},
    {term:1, milestone:'Term 1 complete! 🎉', title:'Statistics — Presenting Data', bbcSearch:'presenting data charts graphs',
      activity:"Collect a data set (favourite fruits of 10 people) and present it as a bar or pie chart with a title and labels.",
      quiz:[{q:'Best chart for proportions of a whole?',opts:['Line graph','Pie chart','Scatter graph','Bar chart'],a:1},{q:'Median of 1,3,3,6,7,8,9?',opts:['6','3','7','9'],a:0},{q:'Range is always:',opts:['The largest value','Highest minus lowest','The average','The most common value'],a:1},{q:'A bar chart is best for comparing:',opts:['Parts of a whole','Separate categories','Only time trends','Nothing, only pie charts work'],a:1},{q:'Which is NOT a type of average?',opts:['Mean','Median','Mode','Percentage'],a:3}]},
    {term:2, title:'Brackets & Factorising I', bbcSearch:'expanding brackets algebra',
      activity:"Learn to expand a single bracket: 3(x+2) = 3x+6. Try 5 expansions, then factorise (find the common factor).",
      quiz:[{q:'Expand 2(x+3).',opts:['2x+3','2x+6','x+6','2x+5'],a:1},{q:'Expand 4(2x−1).',opts:['8x−4','8x−1','6x−4','8x+4'],a:0},{q:'Factorise 6x+9.',opts:['3(2x+3)','6(x+9)','2(3x+9)','3(x+3)'],a:0},{q:'Expand 5(x−2).',opts:['5x−10','5x−2','5x+10','x−10'],a:0},{q:'Factorise 4x+8.',opts:['4(x+2)','2(2x+8)','4(x+8)','8(x+1)'],a:0}]},
    {term:2, title:'Brackets & Factorising II', bbcSearch:'expanding double brackets',
      activity:"Try double brackets: (x+2)(x+3) using a grid. Do 5 questions and check by substituting a number for x.",
      quiz:[{q:'Expand (x+1)(x+2) = x² + ?x + 2.',opts:['2x','3x','x','4x'],a:1},{q:'FOIL roughly stands for:',opts:['First, Outer, Inner, Last','Factor, Order, Index, Log','First, Only, Inner, Last','Full, Outer, Inner, Log'],a:0},{q:'Factorising is the reverse of:',opts:['Substituting','Expanding','Simplifying','Solving'],a:1},{q:'Expand (x+4)(x+1).',opts:['x²+5x+4','x²+4x+1','x²+5x+5','x²+x+4'],a:0},{q:'How many terms before simplifying when multiplying double brackets?',opts:['2','3','4','5'],a:2}]},
    {term:2, title:'Algebraic Fractions', bbcSearch:'algebraic fractions simplifying',
      activity:"Simplify algebraic fractions by cancelling common factors, e.g. 4x/8 = x/2. Try adding two fractions with the same denominator.",
      quiz:[{q:'Simplify 6x/12.',opts:['x/2','2x','6x','x/6'],a:0},{q:'2/x + 3/x = ?',opts:['5/x','5/2x','6/x','5/x²'],a:0},{q:'Simplify 10x²/5x.',opts:['2x','5x','2x²','10x'],a:0},{q:'Simplify 8x/4.',opts:['2x','4x','8x/4','2'],a:0},{q:'Why can we cancel 6x/12 to x/2?',opts:['Both divide by 6','Both divide by 2','They are unrelated','You can never cancel'],a:0}]},
  ],
  computing: [
    {term:1, title:'E-Safety', bbcSearch:'online safety',
      activity:"Watch a short video on staying safe online. Talk about: what to do if a stranger messages you, why sharing photos/location is risky, and how to spot fake profiles. Write 3 rules for a younger sibling.",
      quiz:[{q:'If a stranger asks for your address, you should:',opts:['Give it if they seem nice','Tell a trusted adult','Give a fake one','Ask why first'],a:1},{q:'A fake profile usually:',opts:['Has a verified badge','Pretends to be someone else','Only follows friends','Posts daily'],a:1},{q:'CEOP is a website for:',opts:['Homework help','Reporting online safety concerns','Downloading games','Coding'],a:1},{q:'Sharing your exact location publicly online is:',opts:['Always safe','Risky - it can reveal where you are','Required by most apps','Only risky for adults'],a:1},{q:'If you see something upsetting online, you should:',opts:['Ignore it and keep scrolling','Tell a trusted adult','Share it with friends','Reply angrily'],a:1}]},
    {term:1, milestone:'Term 1 complete! 🎉', title:'Flowcharts (Flowol)', bbcSearch:'algorithms flowcharts',
      activity:"Flowcharts use symbols: oval (start/end), rectangle (step), diamond (decision). Design a flowchart for 'Should I take an umbrella?'.",
      quiz:[{q:'What shape represents a decision?',opts:['Rectangle','Diamond','Circle','Arrow'],a:1},{q:'What shape shows Start/End?',opts:['Diamond','Oval','Rectangle','Triangle'],a:1},{q:'Flowcharts help plan:',opts:['Only music','Step-by-step logic','Only drawings','Handwriting'],a:1},{q:'A rectangle in a flowchart usually represents:',opts:['A decision','A process/step','The end','A loop only'],a:1},{q:'Flowcharts are useful before coding because they:',opts:['Make coding harder','Help you plan logic before writing code','Replace the need for code','Are only for artists'],a:1}]},
    {term:2, title:'Intro to Game Creation', bbcSearch:'Scratch programming basics',
      activity:"Explore Scratch (scratch.mit.edu). Look at 2-3 example games. Spot: what are the 'sprites'? What events make things happen?",
      quiz:[{q:"A 'sprite' is:",opts:['A background','A character/object','A sound file','A level'],a:1},{q:"An 'event' triggers when:",opts:['The game ends','Something happens (key press, click)','You save the file','Randomly'],a:1},{q:'Why do designers test games?',opts:['To make it longer','To find and fix bugs','To add sprites','Not necessary'],a:1},{q:'Scratch is mainly used to teach:',opts:['Cooking','Programming concepts visually','Handwriting','Only art'],a:1},{q:"A 'costume' in Scratch refers to a sprite's:",opts:['Sound effect','Appearance/look','Coordinates','Score'],a:1}]},
    {term:2, title:'Actions & Events', bbcSearch:'Scratch events variables',
      activity:"In Scratch, make a sprite move with arrow keys: when green flag clicked → go to x,y; when key pressed → move 10 steps.",
      quiz:[{q:'To move right, you increase its:',opts:['Y coordinate','X coordinate','Costume number','Volume'],a:1},{q:"'When green flag clicked' is an example of a:",opts:['Loop','Event','Variable','Sprite'],a:1},{q:"A 'loop' means:",opts:['Run once','Repeat an action','Stop the program','Delete a sprite'],a:1},{q:'To make a sprite jump once when a key is pressed, use:',opts:['A forever loop only','An event block for that key','A sound block','A backdrop change'],a:1},{q:"X and Y coordinates together describe a sprite's:",opts:['Colour','Position on the stage','Costume number','Volume'],a:1}]},
    {term:2, title:'Build Your Game (Part 1)', bbcSearch:'Scratch game programming loops',
      activity:"Start a catch/avoid game: player sprite moves with arrow keys, a falling object resets to the top. This is the core loop of many games!",
      quiz:[{q:"A 'variable' stores:",opts:['A picture','A changing value (like score)','A sound','A costume'],a:1},{q:'To make something fall repeatedly, use a:',opts:['If statement only','Repeat/forever loop','Costume','Backdrop'],a:1},{q:"'Reset to the top' means:",opts:['The game ends','Y-position jumps back up','The sprite deletes','Nothing happens'],a:1},{q:"Making an object 'reset' after falling off-screen prevents it from:",opts:['Disappearing forever','Looking different','Making noise','Changing colour'],a:0},{q:"The 'core loop' of a game means:",opts:['The background music','The repeating cycle of actions that make it fun','The title screen','The credits'],a:1}]},
    {term:2, title:'Build Your Game (Part 2 — Scoring)', bbcSearch:'Scratch scoring variables',
      activity:"Add a score variable that increases when the player 'catches' the object (touching-detection block). Add a win/lose message.",
      quiz:[{q:'To detect if two sprites touch, use a:',opts:['Sensing block','Sound block','Looks block','Motion block'],a:0},{q:'A score variable should:',opts:['Stay the same always','Change based on events','Only appear once','Be deleted after use'],a:1},{q:'Testing a game means:',opts:['Playing once, never checking again','Playing to find bugs/improve it','Deleting it','Only asking friends'],a:1},{q:"A 'win condition' tells the game:",opts:['When to start','When the player has succeeded','What colour to use','Nothing important'],a:1},{q:'Why test after adding scoring?',opts:['To make sure it counts correctly',"Testing isn't needed once it's built",'To slow down the game','To remove the score'],a:0}]},
    {term:2, milestone:'Term 2 well underway! 🎮', title:'Testing & Polishing', bbcSearch:'testing debugging programs',
      activity:"Playtest your game 5 times. Fix at least 2 issues (speed, difficulty, sound). Show someone your finished game!",
      quiz:[{q:"'Polishing' a game mainly means:",opts:['Making it longer','Improving small details','Deleting features','Renaming sprites'],a:1},{q:'If a game is too easy, you could:',opts:['Increase difficulty','Delete the game','Add more bugs','Remove the score'],a:0},{q:'Getting feedback from someone else helps because:',opts:['They always agree','Fresh eyes spot missed issues','It wastes time','Games need no feedback'],a:1},{q:'A good way to gather feedback is to:',opts:['Assume everyone will like it','Watch someone play and note what confuses them','Never let anyone else play it','Only test alone'],a:1},{q:'Polishing usually happens:',opts:['Before building anything','After the core game works','Instead of testing','Only if time allows, can be skipped entirely'],a:1}]},
    {term:3, title:'Intro to HTML & Web Pages', bbcSearch:'HTML web design basics',
      activity:"HTML uses tags to build web pages. Try a free sandbox (e.g. w3schools 'Try it Yourself'). Build a page with a heading, paragraph and a list.",
      quiz:[{q:'Which tag creates a heading?',opts:['<p>','<h1>','<li>','<div>'],a:1},{q:'HTML stands for:',opts:['HyperText Markup Language','High Text Machine Language','Home Tool Markup Language','HyperTransfer Markup Language'],a:0},{q:'An unordered list uses which tag?',opts:['<ol>','<ul>','<li> alone','<table>'],a:1},{q:'A paragraph of text uses which tag?',opts:['<p>','<h1>','<ul>','<img>'],a:0},{q:'Tags in HTML usually come in pairs like:',opts:['<p> and </p>','<p> and <q>','Only opening tags exist','<p> and <html>'],a:0}]},
  ],
  science: [

const START_DATE = new Date(2026,6,27);
const SUMMER_END = new Date(2026,8,2);

function mondayOf(d){ const day=d.getDay(); const diff=(day===0?-6:1-day); return new Date(d.getFullYear(),d.getMonth(),d.getDate()+diff); }
function weekIndexOf(d){ return Math.round((mondayOf(d)-mondayOf(START_DATE))/(7*86400000)); }
function isoDate(d){ return d.toISOString().slice(0,10); }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'}); }
function todayStr(){ return isoDate(new Date()); }

function recommendedSubjectFor(date){
  const dow = date.getDay();
  if(dow===0||dow===6) return null;
  const wi = weekIndexOf(date);
  const inSummer = date <= SUMMER_END;
  if(dow===1) return 'maths';
  if(dow===2) return 'computing';
  if(dow===3) return 'science';
  if(dow===4) return (((wi%2)+2)%2===0? 'geography':'history');
  if(dow===5){ if(inSummer){ const rot=['maths','computing','science']; return rot[((wi%3)+3)%3]; } return null; }
}

/* ============ HELPERS ============ */
function sessionsDoneCountInTerm(subject, term){
  const arr = SESSIONS[subject];
  let done=0, total=0;
  arr.forEach((s,i)=>{ if(s.term===term){ total++; if(i < (DATA.progress[subject]||0)) done++; } });
  return {done, total};
}
function termStatus(subject, term){
  const {done,total} = sessionsDoneCountInTerm(subject, term);
  if(total===0) return {label:'Not started', cls:'status-notstarted'};
  if(done===0) return {label:'Not started', cls:'status-notstarted'};
  if(done<total) return {label:'In progress', cls:'status-progress'};
  const cp = (DATA.checkpoints[subject]||{})[term];
  if(cp && cp.status==='passed') return {label:'Complete ✅', cls:'status-complete'};
  return {label:'Checkpoint pending', cls:'status-checkpoint'};
}
function isLockedForNextSession(subject){
  const idx = DATA.progress[subject]||0;
  const arr = SESSIONS[subject];
  const nextSession = arr[idx];
  if(!nextSession) return {locked:false, session:null};
  const prevSession = arr[idx-1];
  if(prevSession && nextSession.term !== prevSession.term){
    const cp = (DATA.checkpoints[subject]||{})[prevSession.term];
    if(!cp || cp.status!=='passed') return {locked:true, needTerm:prevSession.term, session:nextSession};
  }
  return {locked:false, session:nextSession};
}

function markComplete(subject, correctCount, totalQ){
  const t = todayStr();
  if(DATA.log.some(l=>l.date===t && l.subject===subject)) return;
  const idx = DATA.progress[subject]||0;
  DATA.progress[subject] = idx+1;
  DATA.log.push({date:t, subject, correct:correctCount, total:totalQ});
  DATA.points += 10 + correctCount*2;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = isoDate(y);
  if(DATA.streak.lastDate === t){ /* no change */ }
  else if(DATA.streak.lastDate === yStr || DATA.streak.current===0){ DATA.streak.current = (DATA.streak.lastDate===yStr)? DATA.streak.current+1 : 1; }
  else { DATA.streak.current = 1; }
  DATA.streak.lastDate = t;
  if(DATA.streak.current > DATA.streak.longest) DATA.streak.longest = DATA.streak.current;
  saveMain(); quizState = {}; render();
}

window.buildSummary = function(){
  let lines = [`Field Log Progress — ${fmtDate(new Date())}`, `Streak: ${DATA.streak.current} days (longest: ${DATA.streak.longest}) | Points: ${DATA.points}`, ''];
  Object.keys(SUBJECT_META).forEach(subj=>{
    const meta = SUBJECT_META[subj];
    const termLines = [];
    for(let t=1;t<=6;t++){
      const st = termStatus(subj,t);
      if(st.label!=='Not started') termLines.push(`T${t}: ${st.label}`);
    }
    lines.push(`${meta.label}: ${termLines.length? termLines.join(', ') : 'Not started yet'}`);
  });
  lines.push('', `Total sessions logged: ${DATA.log.length}`);
  window.__summaryVisible = true;
  render();
  setTimeout(()=>{ const box=document.getElementById('summary-box'); if(box){ box.value = lines.join('\\n'); box.style.display='block'; box.select(); } },0);
}
window.assessSetSubject = function(v){ assessState = {subject:v, terms:{}, questions:null, answers:[], submitted:false}; render(); }
window.assessToggleTerm = function(t){ assessState.terms[t] = !assessState.terms[t]; render(); }
window.startAssessment = function(){
  const selectedTerms = Object.keys(assessState.terms).filter(t=>assessState.terms[t]).map(Number);
  if(selectedTerms.length===0){ alert('Pick at least one term first.'); return; }
  let pool = [];
  SESSIONS[assessState.subject].forEach(s=>{ if(selectedTerms.includes(s.term)) pool = pool.concat(s.quiz); });
  pool = pool.sort(()=>Math.random()-0.5).slice(0,12);
  assessState.questions = pool;
  assessState.answers = new Array(pool.length).fill(null);
  assessState.submitted = false;
  render();
}
function renderAssessmentQuiz(){
  const meta = SUBJECT_META[assessState.subject];
  let html = `<div class="card"><span class="subject-tag" style="background:${meta.color}">${meta.icon} ${meta.label} Assessment</span>`;
  assessState.questions.forEach((q,qi)=>{
    html += `<div class="quiz-q"><p>${qi+1}. ${q.q}</p>`;
    q.opts.forEach((opt,oi)=>{
      let cls='opt';
      if(assessState.submitted){ if(oi===q.a) cls+=' correct'; else if(assessState.answers[qi]===oi) cls+=' wrong'; }
      html += `<label class="${cls}"><input type="radio" name="assess-${qi}" ${assessState.answers[qi]===oi?'checked':''} ${assessState.submitted?'disabled':''} onchange="assessAnswer(${qi},${oi})"> ${opt}</label>`;
    });
    html += `</div>`;
  });
  if(!assessState.submitted){
    const allAnswered = assessState.answers.every(a=>a!==null);
    html += `<button class="btn-primary" ${allAnswered?'':'disabled'} onclick="submitAssessment()">Submit Assessment</button>`;
  } else {
    const correct = assessState.answers.filter((a,i)=>a===assessState.questions[i].a).length;
    const pct = Math.round((correct/assessState.questions.length)*100);
    const passed = pct>=70;
    html += `<div style="font-family:-apple-system,system-ui,sans-serif; margin-top:8px;"><b>Score: ${correct}/${assessState.questions.length} (${pct}%)</b><br>${passed? '✅ Passed — term(s) marked complete!' : '⚠️ Below 70% — recommend reviewing before moving on.'}</div>`;
  }
  html += `</div>`;
  return html;
}
window.assessAnswer = function(qi,oi){ assessState.answers[qi]=oi; render(); }
window.submitAssessment = function(){
  assessState.submitted = true;
  const correct = assessState.answers.filter((a,i)=>a===assessState.questions[i].a).length;
  const pct = Math.round((correct/assessState.questions.length)*100);
  const passed = pct>=70;
  const selectedTerms = Object.keys(assessState.terms).filter(t=>assessState.terms[t]).map(Number);
  if(!DATA.checkpoints[assessState.subject]) DATA.checkpoints[assessState.subject] = {};
  selectedTerms.forEach(t=>{ DATA.checkpoints[assessState.subject][t] = {status: passed?'passed':'needs review', score:pct, date: todayStr()}; });
  saveMain();
  render();
}

function renderQuiz(subject, sessionIdx, session){
  const key = subject+'-'+sessionIdx;
  if(!quizState[key]) quizState[key] = { answers:new Array(session.quiz.length).fill(null), submitted:false };
  const st = quizState[key];
  let html = '';
  session.quiz.forEach((q,qi)=>{
    html += `<div class="quiz-q"><p>${qi+1}. ${q.q}</p>`;
    q.opts.forEach((opt,oi)=>{
      let cls='opt';
      if(st.submitted){ if(oi===q.a) cls+=' correct'; else if(st.answers[qi]===oi) cls+=' wrong'; }
      html += `<label class="${cls}"><input type="radio" name="${key}-${qi}" ${st.answers[qi]===oi?'checked':''} ${st.submitted?'disabled':''} onchange="selectAnswer('${key}',${qi},${oi})"> ${opt}</label>`;
    });
    html += `</div>`;
  });
  if(!st.submitted){
    const allAnswered = st.answers.every(a=>a!==null);
    html += `<button class="btn-primary" ${allAnswered?'':'disabled'} onclick="submitQuiz('${key}')">Check my answers</button>`;
  } else {
    const correct = st.answers.filter((a,i)=>a===session.quiz[i].a).length;
    const alreadyDoneToday = DATA.log.some(l=>l.date===todayStr() && l.subject===subject);
    html += `<div style="font-family:-apple-system,system-ui,sans-serif;font-size:0.85rem;margin-bottom:8px;">Score: ${correct}/${session.quiz.length}</div>`;
    html += `<button class="btn-complete" ${alreadyDoneToday?'disabled':''} onclick="markComplete('${subject}',${correct},${session.quiz.length})">${alreadyDoneToday? "✓ Already stamped today" : "Stamp today's page ✓"}</button>`;
  }
  return html;
}
window.selectAnswer = function(key,qi,oi){ quizState[key].answers[qi]=oi; render(); }
window.submitQuiz = function(key){ quizState[key].submitted=true; render(); }
window.markComplete = markComplete;

/* ============ PAGE 3: NOTES ============ */
let noteDraft = {date: todayStr(), subject:'maths', text:''};
function renderNotes(){
  let html = `<div class="card">
    <div class="topic-title" style="font-size:1rem;">Add a note</div>
    <div class="notes-form">
      <input type="date" value="${noteDraft.date}" onchange="noteDraft.date=this.value">
      <select onchange="noteDraft.subject=this.value">${Object.keys(SUBJECT_META).map(s=>`<option value="${s}" ${noteDraft.subject===s?'selected':''}>${SUBJECT_META[s].icon} ${SUBJECT_META[s].label}</option>`).join('')}</select>
      <textarea id="note-text-input" placeholder="What did she learn? Any tricky bits?" onchange="noteDraft.text=this.value">${noteDraft.text}</textarea>
      <button class="btn-primary" onclick="addNote()">+ Add Note</button>
    </div>
    <div style="font-family:-apple-system,system-ui,sans-serif; font-size:0.72rem; opacity:0.6; margin-top:6px;">Tip: after saving, the date & subject stay selected so you can quickly add another note for the same day.</div>
  </div>`;
  html += `<div class="card lined">`;
  if(NOTES.length===0){ html += `<div class="activity-text" style="opacity:0.6;">No notes yet — add the first one above.</div>`; }
  else{
    NOTES.slice().reverse().forEach(n=>{
      const meta = SUBJECT_META[n.subject];
      html += `<div class="note-entry"><span class="del-link" onclick="deleteNote(${n.id})">delete</span>
        <div class="meta"><span class="subj-chip" style="background:${meta.color}">${meta.icon} ${meta.label}</span>${n.date}</div>
        <div class="note-text">${n.text}</div></div>`;
    });
  }
  html += `</div>`;
  return html;
}
window.addNote = function(){
  const el = document.getElementById('note-text-input');
  const text = el ? el.value : noteDraft.text;
  if(!text.trim()) return;
  NOTES.push({id:Date.now(), date:noteDraft.date, subject:noteDraft.subject, text:text});
  saveNotes();
  noteDraft.text = '';
  render();
}
window.deleteNote = function(id){
  NOTES = NOTES.filter(n=>n.id!==id);
  saveNotes(); render();
}

/* ============ PAGE 4: TYPING GAME ============ */
const WARMUP_WORDS = ['fjfj jfjf','asdf jkl;','the quick fox','type each key','home row keys','left hand right hand','steady and slow','practice makes progress','look at the screen','fingers on the keys'];
const VOCAB_WORDS = ['expression substitution','multiply divide equation','flowchart variable sprite','algorithm binary decimal','equilibrium pressure force','digestion respiration organism','periodic table element metal','erosion weathering sediment','renaissance reformation empire','conduction convection radiation'];

function newTypingPrompt(){
  const list = typingMode==='warmup'? WARMUP_WORDS : VOCAB_WORDS;
  return list[Math.floor(Math.random()*list.length)];
}
function fmtMinSec(ms){
  const totalSec = Math.round(ms/1000);
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return m>0? `${m}m ${s}s` : `${s}s`;
}
function last7DaysTime(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = isoDate(d);
    days.push({label: d.toLocaleDateString('en-GB',{weekday:'short'}), ms: TYPING.dailyTime[key]||0, isToday: key===todayStr()});
  }
  return days;
}
function renderTyping(){
  const todayMs = TYPING.dailyTime[todayStr()]||0;
  let html = `<div class="card" style="text-align:center;">
    <div class="topic-title" style="font-size:1rem;">⏱️ Time Spent Today</div>
    <div style="font-size:1.8rem; font-weight:800; color:var(--history);">${fmtMinSec(todayMs)}</div>
    <div style="display:flex; gap:5px; margin-top:12px; font-family:-apple-system,system-ui,sans-serif;">
      ${last7DaysTime().map(d=>{
        const maxMs = 10*60000;
        const pct = Math.min(100, Math.round((d.ms/maxMs)*100));
        return `<div style="flex:1; text-align:center; font-size:0.62rem;">
          <div style="height:50px; display:flex; align-items:flex-end;"><div style="width:100%; height:${Math.max(pct,3)}%; background:${d.isToday?'var(--gold)':'#c9bfa3'}; border-radius:3px;"></div></div>
          <div style="margin-top:4px; opacity:0.7;">${d.label}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
  html += `<div class="card type-card">
    <div class="type-mode-row">
      <div class="type-mode ${typingMode==='warmup'?'active':''}" onclick="setTypingMode('warmup')">⌨️ Warm-Up</div>
      <div class="type-mode ${typingMode==='vocab'?'active':''}" onclick="setTypingMode('vocab')">📚 Vocabulary Challenge</div>
    </div>`;

  if(!typingSession) typingSession = { target:newTypingPrompt(), typed:'', startTime:null, done:false };

  const target = typingSession.target;
  let spans = '';
  for(let i=0;i<target.length;i++){
    let cls='ch-pending';
    if(i < typingSession.typed.length){ cls = (typingSession.typed[i]===target[i])? 'ch-correct':'ch-wrong'; }
    spans += `<span class="${cls}">${target[i]===' '?'&nbsp;':target[i]}</span>`;
  }
  html += `<div class="type-target">${spans}</div>`;

  if(!typingSession.done){
    html += `<input class="type-input" id="typing-input" placeholder="Start typing here..." value="${typingSession.typed.replace(/"/g,'&quot;')}" oninput="onTypingInput(this.value)" autocomplete="off" autocapitalize="off" autocorrect="off">`;
  } else {
    const mins = typingSession.elapsedMs/60000;
    const wpm = Math.round((target.length/5)/mins) || 0;
    const correctChars = target.split('').filter((c,i)=>typingSession.typed[i]===c).length;
    const accuracy = Math.round((correctChars/target.length)*100);
    html += `<div class="type-stats">
      <div class="type-stat"><b>${wpm}</b>WPM</div>
      <div class="type-stat"><b>${accuracy}%</b>accuracy</div>
      <div class="type-stat"><b>${TYPING.best.wpm}</b>best WPM</div>
    </div>
    <button class="btn-complete" style="margin-top:14px;" onclick="playAgainTyping()">Play Again</button>`;
  }
  html += `</div>`;
  return html;
}
window.setTypingMode = function(m){ typingMode=m; typingSession=null; render(); }
window.onTypingInput = function(val){
  if(!typingSession.startTime) typingSession.startTime = Date.now();
  typingSession.typed = val;
  if(val.length >= typingSession.target.length){
    typingSession.done = true;
    typingSession.elapsedMs = Date.now()-typingSession.startTime;
    const mins = typingSession.elapsedMs/60000;
    const wpm = Math.round((typingSession.target.length/5)/mins) || 0;
    const correctChars = typingSession.target.split('').filter((c,i)=>typingSession.typed[i]===c).length;
    const accuracy = Math.round((correctChars/typingSession.target.length)*100);
    if(wpm > TYPING.best.wpm) TYPING.best = {wpm, accuracy};
    TYPING.history.push({date:todayStr(), wpm, accuracy, mode:typingMode});
    const t = todayStr();
    TYPING.dailyTime[t] = (TYPING.dailyTime[t]||0) + typingSession.elapsedMs;
    saveTyping();
  }
  render();
  setTimeout(()=>{ const el=document.getElementById('typing-input'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },0);
}
window.playAgainTyping = function(){ typingSession = { target:newTypingPrompt(), typed:'', startTime:null, done:false }; render(); }

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById('app');
  let body = '';
  if(VIEW==='dashboard') body = renderDashboard();
  else if(VIEW==='practice') body = renderPractice();
  else if(VIEW==='notes') body = renderNotes();
  else if(VIEW==='typing') body = renderTyping();
  app.innerHTML = renderHeader() + body;
}

loadAll();
</script>
